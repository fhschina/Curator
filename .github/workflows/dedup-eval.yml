name: Dedup Eval

on:
  pull_request:
    paths:
      - "eval/dedup/**"
      - "nemo_curator/eval/llm_judge/**"
      - "nemo_curator/stages/synthetic/nemo_data_designer/**"
      - "tests/eval/dedup/**"
      - "tests/eval/llm_judge/**"
      - "tests/stages/synthetic/nemo_data_designer/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "eval/dedup/**"
      - "nemo_curator/eval/llm_judge/**"
      - "nemo_curator/stages/synthetic/nemo_data_designer/**"
      - "tests/eval/dedup/**"
      - "tests/eval/llm_judge/**"
      - "tests/stages/synthetic/nemo_data_designer/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: uv sync --locked --extra sdg_cpu --group test
      - name: Run dedup contracts without changing the checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          uv run pytest -q -m "not gpu" \
            tests/eval/dedup \
            tests/eval/llm_judge \
            tests/stages/synthetic/nemo_data_designer/test_data_designer.py
          test -z "$(git status --porcelain --untracked-files=all)"
