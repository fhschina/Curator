rubric:
  KEEP_MAIN: No proved objection. Includes faithful translation and harmless UI. Does not independently assert duplicate membership.
  REJECT_A_REPLACES_B: B contains a retained proposition not preserved in A. A-only additions cannot justify this veto.
  REJECT_B_REPLACES_A: A contains a retained proposition not preserved in B. B-only additions cannot justify this veto.
  REJECT_BOTH: Both documents have uncovered retained content, or an actual incompatible slot, obligation, state, role or membership is evidenced. Independent added Y alone is not a conflict.
  REJECT_EMPTY_ANCHOR: Only an apparent containment with no substantive shared X; account for all shared spans and identify the new substantive content. A complete policy is not empty merely because it is reused.
  ABSTAIN: Material uncertainty or incomplete proof remains. Short-policy completeness disputes are not forced negatives.
