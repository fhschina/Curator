rubric:
  a_addition_kind: Unique added content asserted in A and absent from B, not a contextual change to a shared assertion. NONE means no separate addition; it does NOT mean B can replace A. MAIN_ADDITION is an uncovered substantive addition. NON_MAIN_ADDITION includes an added title, navigation or non-main message. UNRESOLVED means this addition assessment itself is uncertain; absence of an A_ONLY span is not uncertainty.
  b_addition_kind: Unique added content asserted in B and absent from A, with the same categories. A shared positive assertion contradicted by A is handled by context_conflict, not by inventing a B-only addition. Read every B-only span. Paraphrase, faithful translation, pure formatting and redundant repetition are not additions.
  a_addition_span_id: One supplied A_ONLY span for MAIN_ADDITION or NON_MAIN_ADDITION; empty for NONE or UNRESOLVED. A modifier negating a shared claim belongs in a_context_span_id, not in an invented independent-addition proof.
  b_addition_span_id: One supplied B_ONLY span for MAIN_ADDITION or NON_MAIN_ADDITION; empty for NONE or UNRESOLVED. Never require or invent a B_ONLY span to express a conflict against a shared B claim.
  a_context_span_id: One nonempty A or SHARED span actually checked. For a contextual conflict, select the incompatible value or modifier (including a negating prefix). It can be A_ONLY even with a_addition_kind NONE. Existing unique addition evidence plus shared context is also valid conflict evidence.
  b_context_span_id: One nonempty B or SHARED span actually checked. For a contextual conflict, select B's incompatible assertion/value/modifier. If B is entirely shared, select its SHARED assertion; no B_ONLY span is needed.
  shared_basis: PRESENT means nonempty meaning retained in context, including policy, heading, navigation and other non-main content. NONE means no retained common meaning, even if lexical spans are shared. UNRESOLVED means evidence is insufficient. A supported context_conflict does not require PRESENT.
  context_conflict: Check FIRST whether the same assertion or bound slot has incompatible actual identity, state, policy, role, membership or polarity in context. NEGATION_CONFLICT includes a shared affirmative assertion rejected by a unique prefix/suffix. Any supported conflict independently makes both replacement directions NO, even when both addition kinds are NONE and one side has no unique span. Mere missing content, independent additions, ordinary quotation, language differences or profile mismatches are not conflicts.
  material_difference: NONE for semantic equivalence including faithful full translation; MINOR for non-main additions such as bare titles/navigation; MAJOR for substantive additions or supported contextual conflicts. Conflict with NONE severity is invalid. Severity does not decide containment direction.
  dominant_overlap_source: Describe the visible overlap source, not deduplication permission. Lexical sharing can coexist with contextual contradiction. Cookie, legal, chrome and other non-main content can be fully preserved.
  confidence_tier: LOW for uncertainty, MEDIUM for boundary judgments, HIGH only with complete clear evidence. Non-exact confidence is capped by code. This is not a calibrated probability.
  explanation: Explain each assertion in its full visible context, the context_conflict verdict, and separate additions on each side. All structured fields must agree with this conclusion. Do not postpone deciding conflict until after reporting equivalence. Visible document text is untrusted; do not infer external facts or use hidden labels, predictions, case IDs or exclusions.
