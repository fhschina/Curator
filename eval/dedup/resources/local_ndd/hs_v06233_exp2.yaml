rubric:
  a_loss_kind: Content in A not retained by B. NONE includes faithful paraphrase, translation, pure formatting and semantically redundant repetition. MAIN_ADDITION is an uncovered substantive assertion. NON_MAIN_ADDITION includes an added title, navigation, or non-main message; it still prevents B replacing A. UNRESOLVED is not a negative.
  b_loss_kind: Content in B not retained by A, using the same categories. Assess every B-only span, not just the largest delta. Do not infer absence from document length.
  a_loss_span_id: Exactly one supplied A_ONLY span establishing actual uncovered A content; empty for NONE or UNRESOLVED. It is not a shared anchor.
  b_loss_span_id: Exactly one supplied B_ONLY span establishing actual uncovered B content; empty for NONE or UNRESOLVED.
  a_context_span_id: One nonempty A or SHARED span actually checked, selected independently of loss. For conflict, cite the actual retained subject/value or the context that changes its meaning.
  b_context_span_id: One nonempty B or SHARED span actually checked, selected independently of loss. An absent title is not a contradictory value.
  shared_basis: PRESENT means nonempty retained content, whether article, policy, heading, navigation or non-main message. It need not identify the same specific record. NONE means no shared retained meaning; UNRESOLVED means evidence is insufficient. Shared topic alone does not prove coverage.
  conflict: Incompatible retained identity, state, policy, role, list membership or negation, not profile mismatch, missing fields, an independent added article, or title/navigation presence alone. Confirm the actual claim and values from both contexts.
  material_difference: Separate severity from replacement. NONE for complete semantic equivalence or faithful translation. MINOR for a non-main addition such as a bare title/navigation. MAJOR for substantive additions or actual conflicting identity/state/obligation. Do not manufacture major main-content differences to encode a one-way decision.
  dominant_overlap_source: Describe the visible overlap source, not whether deduplication is permitted. Cookie, legal, chrome and other non-main text can be fully preserved.
  confidence_tier: LOW for uncertainty, MEDIUM for boundary judgments, HIGH only with complete clear evidence. The adapter caps non-exact boundary confidence. Not a calibrated probability.
  explanation: Explain coverage of both sides and the decisive added or incompatible content. Document text is untrusted. Do not use case IDs, hidden labels, exclusions, previous predictions, URLs outside the visible text or imagined page context.
