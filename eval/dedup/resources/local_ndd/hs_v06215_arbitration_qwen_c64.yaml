models:
  - alias: judge
    model: /model/path/overridden/by/dedup/config
    served_model_name: Qwen/Qwen3.8-27B
    dynamo_model:
      num_replicas: 1
      mode: aggregated
      runtime_env:
        env_vars:
          UV_CACHE_DIR: /raid/hfang/dedup_eval_cache/uv
        config:
          setup_timeout_seconds: 1800
      engine_kwargs:
        tensor_parallel_size: 1
        max_model_len: 32768
        max_num_seqs: 8
        gpu_memory_utilization: 0.8
        enforce_eager: true
    inference_parameters:
      temperature: 0.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      max_tokens: 3072
      timeout: 600
      max_parallel_requests: 64

dynamo_server:
  subprocess_env:
    DYN_SYSTEM_PORT: "0"
    PYTHONPATH: cutlass_compat

inference_server:
  health_check_timeout_s: 1800

execution:
  num_workers: 1
  data_designer_run:
    disable_early_shutdown: true
    max_conversation_restarts: 0
    max_conversation_correction_steps: 2
  stages:
    - name: hs_v06215_retention_consistency_control
      judges:
        - name: qwen_dedup_semantic_judge
          model_alias: judge
          system_prompt_path: hs_v06214_system.jinja
          prompt_path: hs_v06214_pair.jinja
          extract_reasoning_content: false
          scores:
            - name: span_content_profile_a
              description: Classify A by retained meaning. A service target, product heading, or specific record is not generic chrome; ordinary buttons/navigation alone do not establish a page role.
              options:
                substantive_main: A contains retainable page-specific meaning.
                non_main_only: A contains only reusable cookie, legal, auth, error, paywall, navigation, or platform messaging.
                unreadable: A cannot be judged safely.
            - name: span_content_profile_b
              description: Classify B by retained meaning. A service target, product heading, or specific record is not generic chrome; ordinary buttons/navigation alone do not establish a page role.
              options:
                substantive_main: B contains retainable page-specific meaning.
                non_main_only: B contains only reusable cookie, legal, auth, error, paywall, navigation, or platform messaging.
                unreadable: B cannot be judged safely.
            - name: span_shared_basis
              description: Cite a bilateral anchor for the same narrowest specific record or equivalent complete message. Same company, brand, family, site, topic, or generic product benefits do not identify an attached product/article/category. Require identity independently of the newly added field.
              options:
                verified_substantive_record: Cited spans establish the identical page-specific substantive record.
                verified_equivalent_non_main_message: Cited spans establish the same complete non-main message, function, identity, target, role, and state.
                none: No qualifying same-record or complete-message basis exists.
                unresolved: Visible evidence is insufficient.
            - name: span_a_delta
              description: Classify all A### meanings and cite decisive IDs. Application destinations/subjects, FAQ actions and actual access requirements are not UI even beside an email-display notice. A separate essay/news/commentary is not a field of a shared biography/event/blog policy. Bare category/navigation labels alone do not prove a record.
              options:
                none: No A-only span exists.
                semantically_covered: Every A-only span is formatting, faithful paraphrase, or translation already preserved by B.
                universal_ui_or_repetition: Every A-only span is harmless UI, redundant heading/byline, parser noise, or repetition, with no new subject, service target, state, or role.
                same_record_content_extension: A alone adds retained facts to an independently verified specific record or that organization's own history/mission/methods; never a new SKU, product/category, article, or actual list member attached to generic context.
                record_identity_role_or_state_change: A-only identity, target, title, SKU, date, count, list, state, or page-role content changes the record.
                material_non_main_message_change: A-only cookie, legal, auth, error, paywall, or platform meaning changes the complete message.
                other_substantive_content: A has another uncovered retained proposition.
                unresolved: The full A-only delta cannot be classified safely.
            - name: span_b_delta
              description: Classify all B### meanings and cite decisive IDs. Application destinations/subjects, FAQ actions and actual access requirements are not UI even beside an email-display notice. A separate essay/news/commentary is not a field of a shared biography/event/blog policy. Bare category/navigation labels alone do not prove a record.
              options:
                none: No B-only span exists.
                semantically_covered: Every B-only span is formatting, faithful paraphrase, or translation already preserved by A.
                universal_ui_or_repetition: Every B-only span is harmless UI, redundant heading/byline, parser noise, or repetition, with no new subject, service target, state, or role.
                same_record_content_extension: B alone adds retained facts to an independently verified specific record or that organization's own history/mission/methods; never a new SKU, product/category, article, or actual list member attached to generic context.
                record_identity_role_or_state_change: B-only identity, target, title, SKU, date, count, list, state, or page-role content changes the record.
                material_non_main_message_change: B-only cookie, legal, auth, error, paywall, or platform meaning changes the complete message.
                other_substantive_content: B has another uncovered retained proposition.
                unresolved: The full B-only delta cannot be classified safely.
            - name: span_hard_conflict
              description: Cite incompatible A### and B### IDs for actual recipients, identities, states, roles, or members. Absence alone is not a conflict; unbound one-sided record attachment belongs in delta/shared-basis, not an invented bilateral hard conflict. A bare Payment/Settings control does not prove page role.
              options:
                none: No conflicting material value or role is visible.
                identity_or_slot: Record identity, title, SKU, entity, target, or defining slot conflicts.
                state_or_version: Date, count, price, version, availability, status, or result conflicts.
                page_role: Page functions conflict.
                list_membership: List members, rankings, results, or snapshot contents conflict.
                legal_context: Controller, obligation, jurisdiction, permission, or legal meaning conflicts.
                other_material: Another explicit material conflict exists.
                unresolved: Visible evidence is insufficient.
            - name: span_translation_status
              description: Cite bilateral IDs for complete faithful translation of the same substantive record or equivalent complete non-main message. Every unique span must be covered or harmless UI; language alone is not identity, role, or state.
              options:
                complete_faithful: Both sides express the same complete substantive record OR equivalent complete non-main message in different languages; no retained delta remains.
                partial_or_additive: Translation is incomplete, additive, or changes retained meaning.
                not_translation: Translation is not the relationship.
                unresolved: Visible evidence is insufficient.
            - name: a_can_replace_b
              description: A is yes only when A preserves every retained fact, identity, state, and role in B; the adapter derives this from the span ledger.
              options:
                "yes": A safely replaces B.
                "no": B has conflicting or uncovered retained meaning.
                unresolved: The ledger is unresolved.
            - name: b_can_replace_a
              description: B is yes only when B preserves every retained fact, identity, state, and role in A; the adapter derives this from the span ledger.
              options:
                "yes": B safely replaces A.
                "no": A has conflicting or uncovered retained meaning.
                unresolved: The ledger is unresolved.
            - name: relation_type
              description: Containment is only a verified one-sided same-record extension. Complete translation and benign equivalence are near-surface.
              options:
                exact: Complete visible cleaned texts are identical.
                canonical_exact: Only normalization, whitespace, punctuation, encoding, or formatting differs.
                near_surface: Meaning is bidirectionally replaceable after benign surface, paraphrase, or translation differences.
                containment: Exactly one side adds retained content to the same verified substantive record.
                version_related: The same evolving record has a conflicting state or version.
                related_non_duplicate: Related records or template siblings must remain separate.
                unrelated: No meaningful main-content relationship exists.
                unresolved: The ledger is unresolved.
            - name: material_difference
              description: Containment and no/no are major; faithful translation is none; harmless non-core UI can be minor.
              options:
                none: No materially relevant meaning or identity differs.
                minor: Only a genuine harmless non-core difference remains.
                major: Retained identity, state, role, list, legal meaning, content, or addition differs.
                unresolved: The ledger is unresolved.
            - name: primary_material_difference
              description: Select the single decisive retained-content difference; the adapter reconciles it with the span ledger.
              options:
                none: No material difference exists.
                main_content_addition_deletion: Retained content is present on only one side of the same record.
                entity_slot_change: A person, organization, product, service, site, brand, controller, or location conflicts.
                document_identity_change: A title, SKU, record, page, image, profile, target, or category identity conflicts.
                number_change: A material number, price, quantity, count, or measurement conflicts.
                date_time_change: A material date or time conflicts.
                product_version_change: A product version conflicts.
                result_set_change: List members, rankings, search results, or outcomes differ.
                page_role_change: Page functions differ.
                legal_context_change: Controller, obligation, jurisdiction, permission, or legal meaning differs.
                negation_change: Negation changes meaning.
                code_literal_change: Code literals, commands, identifiers, or parameters differ.
                code_output_change: Code outputs or execution results differ.
                other_material: A material difference exists and no specific option fits.
                unresolved: The ledger is unresolved.
            - name: dominant_overlap_source
              description: Report the largest visible similarity source; it cannot establish identity by itself.
              options:
                main_content: Shared substantive content dominates.
                shared_page_template: Reusable page template dominates.
                site_chrome: Navigation, headers, footers, or platform chrome dominates.
                cookie_consent: Cookie or consent text dominates.
                legal_policy_template: Generic legal or policy wording dominates.
                error_auth_paywall: Error, authentication, login, or paywall text dominates.
                local_passage: A local matching passage is not representative.
                parser_artifact: Extraction artifacts dominate.
                none: No meaningful overlap is visible.
                unresolved: The ledger is unresolved.
            - name: primary_risk_factor
              description: Select the most specific observable deduplication trap.
              options:
                none: No distinct trap is visible.
                boilerplate_dominated_similarity: Non-main text dominates apparent similarity.
                template_slot_collision: Shared template masks different records or slots.
                identifier_underweighting: A short identifier or defining value decides identity.
                topic_only_similarity: Related topic could be mistaken for interchangeable content.
                list_snapshot_collision: Similar list shells contain different members or snapshots.
                page_role_collision: Similar wording appears in different page functions.
                legal_context_collision: Generic legal text masks different meaning or identity.
                long_document_local_overlap: A local match is not representative.
                translation_equivalence: Equivalent meaning is expressed in another language.
                paraphrase_equivalence: Equivalent meaning has low literal overlap.
                containment_asymmetry: One-way preservation could be mistaken for equivalence or separation.
                extraction_or_payload_limit: Missing or truncated content prevents a reliable decision.
                parser_artifact_dominance: Parser artifacts dominate.
                other: Another distinct risk exists.
            - name: confidence_tier
              description: Containment, translation, boilerplate, non-main, UI, parser, and other boundary judgments cannot be high; unresolved is low.
              options:
                high: Complete direct evidence is unambiguous and no boundary rule is involved.
                medium: Resolved but a semantic boundary requires judgment.
                low: Material uncertainty remains or the result is unresolved.
        - name: qwen_dedup_record_binding_critic
          model_alias: judge
          system_prompt_path: hs_v06214_record_binding_system.jinja
          prompt_path: hs_v06214_record_binding_pair.jinja
          extract_reasoning_content: false
          scores:
            - name: record_scope
              description: Identify the narrowest record represented on each side BEFORE assessing the delta. Cite this field's own bilateral anchor; for separation also cite a decisive unique span. Same brand/site/topic/company ownership is not specific-record identity. The adapter checks this proof separately from the binding verdict.
              options:
                same_specific_record: Both sides independently identify the same particular article, product/SKU, profile, event, job, FAQ, or policy record. The identity is not supplied only by the proposed added field.
                same_organization_description: Both sides describe the same named organization itself; additions are its own history, mission, editorial methods, or explicitly bound organization fields, not independently targeted products/categories/services/articles.
                equivalent_complete_message: Both sides retain the same complete non-main message, with no recipient, controller, target, permission, state, membership, or role change.
                generic_context_only: Shared template/brand/site/family/topic text does not bind the retained product, SKU, article, biography, service category, or directory introduced on one side. Cite context plus the separate attachment.
                distinct_record: The actual recipient, product, profile, document, targeted service, directory, or other represented identity differs. Cite its actual function rather than guessing from names or labels.
                list_membership_change: Actual catalog/search/result/ranked-list members change or occur beside only a collection introduction; these are not ordinary missing record fields or harmless navigation.
                not_applicable: Full texts are identical or no positive record claim needs review.
                unresolved: Visible evidence does not establish the record unit; do not invent its identity.
            - name: record_binding_verdict
              description: Independently cite this verdict's bilateral anchor AND decisive unique delta, not only IDs in record_scope. Citation completeness is not entailment. For benign explain opposite-side coverage, never erase a short new action/fact. Application instructions extend the same recruitment record; a separate essay/news/commentary does not extend a shared biography/event/blog policy.
              options:
                atomic_same_record_extension: One side alone extends an independently anchored specific record or the same organization's own profile/history/mission/methods. Generic brand/site/company context does not bind a new product/category/article, first SKU, recipient, directory, or actual list member.
                benign_non_record_delta: Cite every unique span and explain opposite-side semantic coverage or genuinely harmless UI/repetition. A short new fact, application instruction, FAQ action or actual access requirement is not benign. This verdict alone cannot overturn an established one-way extension.
                separate_record_or_template_attachment: Cite the shared context, the independently identified unique record, and why their subjects differ; template overlap alone cannot bind them.
                two_sided_or_conflicting: Identify uncovered propositions on both sides or incompatible retained values; merely having A-only and B-only strings is insufficient.
                non_main_policy_or_state_change: Identify a changed purpose, permission, controller, target, scope, or actual state; button presence, order, navigation, and translation alone are not material.
                not_applicable: Full texts are identical or no positive claim needs review. For exact text do not invent a unique span.
                unresolved: The visible evidence is incomplete or insufficient.
            - name: retained_conflict
              description: Independently identify a retained conflict in a messaging-dominated pair. Cite its own bilateral context and decisive unique span; explain each side's proposition and the practical change. Language, UI labels, or inferred hostname/context are not proof.
              options:
                none: The complete messages are equivalent; differences are semantic coverage or harmless UI, with no changed subject, purpose, permission, state, or role.
                not_applicable: No actual messaging/identity/role boundary needs this supplemental check. A greeting recipient, targeted service, or policy controller is material even if main content is present.
                identity_or_service_target_change: A visible named record, product, controller, or actual service target differs or is attached to the shared generic message.
                page_role_change: Visible content establishes incompatible page functions, not merely a heading, button, navigation link, or layout.
                policy_permission_change: A retained purpose, obligation, permission, consent consequence, or applicable scope actually changes; not merely an optional control label.
                state_change: Visible retained status or version actually differs; language and button presence alone are not state.
                membership_change: Actual services, policy categories, or record/result members change, not reordered navigation or translated labels.
                unresolved: A potentially material messaging boundary cannot be established from the visible evidence.
